[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fablecord"
dynamic = ["version"]
description = "A dependency-free async Discord API library and bot framework"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cqlsh" }]
maintainers = [{ name = "cqlsh" }]
keywords = ["discord", "discord-api", "bot", "async", "asyncio", "framework"]
dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/cqlsh/Fablecord.py"
Repository = "https://github.com/cqlsh/Fablecord.py"
Issues = "https://github.com/cqlsh/Fablecord.py/issues"
Changelog = "https://github.com/cqlsh/Fablecord.py/blob/master/CHANGELOG.md"

[tool.hatch.version]
path = "src/fablecord/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fablecord"]

[tool.hatch.build.targets.sdist]
include = [
    "src/fablecord",
    "README.md",
    "LICENSE",
    "CHANGELOG.md"
]